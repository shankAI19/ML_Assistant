[project]
name = "ml-assistant"
version = "0.1.0"
description = "An approval-driven, sandboxed binary classification workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langchain>=1.4.9",
    "langgraph>=1.2.20",
    "langchain-openai>=1.0,<3",
    "docker>=7.1,<8",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["docker: requires the locally built sandbox image and Docker"]

[tool.ruff]
line-length = 100
